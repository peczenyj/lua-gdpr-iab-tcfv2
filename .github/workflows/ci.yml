name: Continuous Integration

on:
  push:
    branches: [ devel, main, "exp/*" ]
  pull_request:
    branches: [ devel, main, "exp/*" ]

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.luaVersion }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
        luaVersion: ["5.5", "5.4", "5.3", "5.2", "5.1", "luajit", "luajit-openresty"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Lua
      uses: hishamhm/gh-actions-lua@master
      with:
        luaVersion: ${{ matrix.luaVersion }}

    - name: Setup LuaRocks
      uses: hishamhm/gh-actions-luarocks@master
      with:
        luaRocksVersion: "3.13.0"

    - name: Install StyLua
      run: |
        if [[ "${{ runner.os }}" == "Linux" ]]; then
          STYLUA_VERSION=v0.20.0
          wget https://github.com/JohnnyMorganz/StyLua/releases/download/${STYLUA_VERSION}/stylua-linux-x86_64.zip
          unzip stylua-linux-x86_64.zip
          chmod +x stylua
          sudo mv stylua /usr/local/bin/
        else
          brew install stylua
        fi

    - name: Install Dev Dependencies
      run: |
        luarocks install busted
        luarocks install luacov
        luarocks install luacov-coveralls

    - name: Run CI (Format Check, Test)
      run: |
        LUA_EXEC="lua"
        if [[ "${{ matrix.luaVersion }}" == "luajit"* ]]; then
          LUA_EXEC="luajit"
        fi
        
        # Performance/Exhaustive Logic:
        # Standard Lua versions run TCF_QUICK=1 (128 entries) to stay fast.
        # High-performance versions (5.5, JIT) run FULL SCAN (100k+ entries).
        export TCF_VERBOSE=0
        export TCF_CONTINUE_ON_FAILURE=1
        
        if [[ "${{ matrix.luaVersion }}" == "5.5" || "${{ matrix.luaVersion }}" == "luajit"* ]]; then
          echo "Executing FULL exhaustive verification scan..."
          export TCF_QUICK=0
        else
          echo "Executing quick verification scan..."
          export TCF_QUICK=1
        fi

        make check-format LUA_BIN=$LUA_EXEC
        make test LUA_BIN=$LUA_EXEC
        make test-reference LUA_BIN=$LUA_EXEC
        make test-fuzz LUA_BIN=$LUA_EXEC

    - name: Report Coverage
      if: success() && matrix.os == 'ubuntu-22.04'
      run: |
        # We run unit tests with coverage and report (Ubuntu only to avoid duplication)
        make coverage
        make report-coverage
      env:
        COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}

    - name: Verify Rockspec
      run: |
        # Ensure the rockspec can be built and installed
        luarocks make --tree .rocks_verify *.rockspec

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Create Release Artifacts
      run: make dist
      
    - name: Upload Release Artifacts
      uses: softprops/action-gh-release@v2
      with:
        files: |
          lua-gdpr-iab-tcfv2-*.tar.gz
          *.rockspec
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
