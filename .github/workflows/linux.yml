name: Linux Tests

on:
  push:
    branches: [ devel, main ]
  pull_request:
    branches: [ devel, main ]

jobs:
  test:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        luaVersion: ["5.4", "5.3", "5.2", "5.1", "luajit", "luajit-openresty"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Lua
      uses: hishamhm/gh-actions-lua@master
      with:
        luaVersion: ${{ matrix.luaVersion }}

    - name: Setup LuaRocks
      uses: hishamhm/gh-actions-luarocks@master
      with:
        luaRocksVersion: "3.13.0"

    - name: Install StyLua
      run: |
        STYLUA_VERSION=v0.20.0
        wget https://github.com/JohnnyMorganz/StyLua/releases/download/${STYLUA_VERSION}/stylua-linux-x86_64.zip
        unzip stylua-linux-x86_64.zip
        chmod +x stylua
        sudo mv stylua /usr/local/bin/

    - name: Install Dev Dependencies
      run: |
        luarocks install busted
        luarocks install luacheck
        luarocks install luacov

    - name: Run CI (Format Check, Lint, Test, Coverage)
      run: |
        if [[ "${{ matrix.luaVersion }}" == "luajit"* ]]; then
          # Full corpus for JIT/OpenResty
          make ci LUA_BIN=luajit
        else
          # Quick tests for PUC-Rio Lua versions
          make ci BUSTED="TCF_QUICK=1 busted"
        fi

    - name: Verify Rockspec
      run: |
        # Ensure the rockspec can be built and installed
        luarocks make --tree .rocks_verify *.rockspec

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Create Release Artifacts
      run: make dist
      
    - name: Upload Release Artifacts
      uses: softprops/action-gh-release@v2
      with:
        files: |
          lua-gdpr-iab-tcfv2-*.tar.gz
          *.rockspec
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
