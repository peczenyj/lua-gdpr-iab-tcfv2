name: Linux Tests

on:
  push:
    branches: [ devel, main ]
  pull_request:
    branches: [ devel, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        luaversion: ["5.1", "5.2", "5.3", "5.4", "luajit", "luajit-openresty"]

    steps:
    - uses: actions/checkout@v4
    
    - uses: leafo/gh-actions-lua@v10
      with:
        luaVersion: ${{ matrix.luaversion }}

    - uses: leafo/gh-actions-luarocks@v4

    - name: Install Dev Dependencies
      run: |
        luarocks install busted
        luarocks install luacheck
        luarocks install luacov

    - name: Run Linter (Luacheck)
      run: make lint

    - name: Run Tests
      run: |
        export LUA_PATH="./?.lua;./src/?.lua;;"
        # Fix for environments where lua might be named differently
        LUA_CMD=$(which lua || which luajit || echo "lua")
        $LUA_CMD test/plumbing_spec.lua

    - name: Run Coverage (Busted)
      run: make coverage

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Create Release Artifacts
      run: make dist
      
    - name: Upload Release Artifacts
      uses: softprops/action-gh-release@v2
      with:
        files: |
          lua-gdpr-iab-tcfv2-*.tar.gz
          *.rockspec
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
