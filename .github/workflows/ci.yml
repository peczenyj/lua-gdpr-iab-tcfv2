name: Continuous Integration

on:
  push:
    branches: [ devel, main ]
  pull_request:
    branches: [ devel, main ]
  # Tag pushes are handled by release.yml, which invokes this workflow
  # via workflow_call as its test gate before publishing.
  workflow_call:

jobs:
  test-linux:
    name: test (Linux, ${{ matrix.luaVersion }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        luaVersion: ["5.5", "5.4", "5.3", "5.2", "5.1", "luajit", "luajit-openresty"]
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
    - name: Setup Lua
      uses: hishamhm/gh-actions-lua@6fff34a54b160acea12880a638eab0960507c1f5 # master @ 2026-05-18
      with:
        luaVersion: ${{ matrix.luaVersion }}
    - name: Setup LuaRocks
      uses: hishamhm/gh-actions-luarocks@86ccbcad8c77b22e94c96a2a08632192e2bcd62b # master @ 2026-05-18
      with:
        luaRocksVersion: "3.13.0"
    - name: Install StyLua
      run: |
        STYLUA_VERSION=v0.20.0
        wget https://github.com/JohnnyMorganz/StyLua/releases/download/${STYLUA_VERSION}/stylua-linux-x86_64.zip
        unzip stylua-linux-x86_64.zip
        chmod +x stylua
        sudo mv stylua /usr/local/bin/
    - name: Install Dev Dependencies
      run: |
        luarocks install busted
        luarocks install luacov
        luarocks install luacov-coveralls
    - name: Run CI (Format Check, Test)
      run: |
        LUA_EXEC="lua"
        if [[ "${{ matrix.luaVersion }}" == "luajit"* ]]; then
          LUA_EXEC="luajit"
        fi
        export TCF_VERBOSE=0
        export TCF_CONTINUE_ON_FAILURE=1
        if [[ "${{ matrix.luaVersion }}" == "5.5" || "${{ matrix.luaVersion }}" == "luajit"* ]]; then
          export TCF_QUICK=0
        else
          export TCF_QUICK=1
        fi
        make check-format LUA_BIN=$LUA_EXEC
        make test LUA_BIN=$LUA_EXEC
        make test-reference LUA_BIN=$LUA_EXEC
        make test-fuzz LUA_BIN=$LUA_EXEC
    # Gate coverage upload to a single matrix entry. Previously every
    # Linux cell ran make coverage + uploaded to Coveralls, producing 7
    # duplicate uploads per CI run. Lua 5.4 is the canonical row.
    - name: Report Coverage
      if: success() && matrix.luaVersion == '5.4'
      run: |
        make coverage
        make report-coverage
      env:
        COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
    - name: Verify Rockspec
      run: luarocks make --tree .rocks_verify *.rockspec

  test-macos:
    name: test (macOS, ${{ matrix.luaVersion }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        luaVersion: ["5.4", "luajit"]
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
    - name: Setup Lua
      uses: hishamhm/gh-actions-lua@6fff34a54b160acea12880a638eab0960507c1f5 # master @ 2026-05-18
      with:
        luaVersion: ${{ matrix.luaVersion }}
    - name: Setup LuaRocks
      uses: hishamhm/gh-actions-luarocks@86ccbcad8c77b22e94c96a2a08632192e2bcd62b # master @ 2026-05-18
      with:
        luaRocksVersion: "3.13.0"
    - name: Install StyLua
      run: brew install stylua
    - name: Install Dev Dependencies
      run: |
        luarocks install busted
        luarocks install luacov
    - name: Run CI (Format Check, Test)
      run: |
        LUA_EXEC="lua"
        if [[ "${{ matrix.luaVersion }}" == "luajit"* ]]; then
          LUA_EXEC="luajit"
        fi
        export TCF_VERBOSE=0
        export TCF_CONTINUE_ON_FAILURE=1
        if [[ "${{ matrix.luaVersion }}" == "luajit"* ]]; then
          export TCF_QUICK=0
        else
          export TCF_QUICK=1
        fi
        make check-format LUA_BIN=$LUA_EXEC
        make test LUA_BIN=$LUA_EXEC
        make test-reference LUA_BIN=$LUA_EXEC
        make test-fuzz LUA_BIN=$LUA_EXEC

