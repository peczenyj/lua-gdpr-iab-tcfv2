name: Linux Tests

on:
  push:
    branches: [ devel, main ]
  pull_request:
    branches: [ devel, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        luaversion: ["5.1", "5.2", "5.3", "5.4", "luajit"]

    steps:
    - uses: actions/checkout@v4
    
    - uses: leafo/gh-actions-lua@v10
      with:
        luaVersion: ${{ matrix.luaversion }}

    - uses: leafo/gh-actions-luarocks@v4

    - name: Install StyLua
      run: |
        STYLUA_VERSION=v0.20.0
        wget https://github.com/JohnnyMorganz/StyLua/releases/download/${STYLUA_VERSION}/stylua-linux-x86_64.zip
        unzip stylua-linux-x86_64.zip
        chmod +x stylua
        sudo mv stylua /usr/local/bin/

    - name: Install Dev Dependencies
      run: |
        # Help LuaRocks find the correct manifest for 5.1/luajit
        LV="${{ matrix.luaversion }}"
        if [ "$LV" == "luajit" ]; then
           LV="5.1"
        fi
        luarocks install --lua-version $LV busted
        luarocks install --lua-version $LV luacheck
        luarocks install --lua-version $LV luacov

    - name: Run CI (Format Check, Lint, Test, Coverage)
      run: |
        if [ "${{ matrix.luaversion }}" == "luajit" ]; then
          make ci LUA_BIN=luajit
        else
          make ci
        fi

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Create Release Artifacts
      run: make dist
      
    - name: Upload Release Artifacts
      uses: softprops/action-gh-release@v2
      with:
        files: |
          lua-gdpr-iab-tcfv2-*.tar.gz
          *.rockspec
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
